name: macro_tracker
description: A fast, premium macro and nutrition tracker designed for gym enthusiasts and athletes.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^13.0.0

  # Networking (for future Supabase integration)
  dio: ^5.4.0

  # JSON Serialization
  json_annotation: ^4.8.1
  json_serializable: ^6.7.1

  # Environment Variables
  flutter_dotenv: ^5.1.0

  # UI & Design
  flutter_svg: ^2.0.9

  # Utilities
  equatable: ^2.0.5
  intl: ^0.18.1

  # Charts (for future analytics)
  fl_chart: ^0.66.0

  cupertino_icons: ^1.0.6
  drift: 2.28.0
  drift_flutter: 0.2.0
dev_dependencies:
  flutter_project_structure: ^2.0.4
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^3.0.1

  # Code Generation
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9
  freezed: ^2.4.6
  freezed_annotation: ^2.4.1

  # Testing
  mocktail: ^1.0.2
  drift_dev: 2.28.0

flutter:
  uses-material-design: true

  fonts:
    - family: Nothing
      fonts:
        - asset: assets/fonts/NOTHING.otf.ttf
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist/ttf/Geist-Thin.ttf
          weight: 100
        - asset: assets/fonts/Geist/ttf/Geist-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Geist/ttf/Geist-Light.ttf
          weight: 300
        - asset: assets/fonts/Geist/ttf/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist/ttf/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist/ttf/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist/ttf/Geist-Bold.ttf
          weight: 700
        - asset: assets/fonts/Geist/ttf/Geist-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Geist/ttf/Geist-Black.ttf
          weight: 900

  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/data/
